base_url = "https://amp.torc.art"
title = "Agile Meteor Press"
description = "A small press at an oasis in Truth or Consequences, New Mexico: hyper local publishing, small beautiful books of unique stories."
compile_sass = false
minify_html = false
default_language = "en"

# No taxonomies: the five that were declared here (recommender, authorname,
# pubyear, rating, readstate) had no pages and no templates, so their list
# pages sat in the sitemap answering 404 (audit, 2026-10-26).

[slugify]
paths = "on"
anchors = "on"

[markdown]
render_emoji = true
external_links_target_blank = true
smart_punctuation = true
# highlighting stays off — that is zola's default; the old explicit
# `highlight_code = false` stopped parsing in zola 0.22

[link_checker]
internal_level = "warn"

[extra]
author = "kpc"
default_theme = "light"
twitter_card = true
epoch = "PLACEHOLDER"



# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false
